<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caption Source Check</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to caption status</a>
    <main id="main">
      <header class="topline">
        <span class="brand-mark" aria-hidden="true"></span>
        <p>Caption Source Check</p>
        <button id="rescan" class="icon-button" type="button" aria-label="Scan this page again" title="Scan again">↻</button>
      </header>
      <section id="status" class="status state--loading" aria-live="polite" aria-busy="true">
        <div class="status-heading">
          <span class="status-dot" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Current page</p>
            <h1 id="status-title">Checking for captions…</h1>
          </div>
        </div>
        <p id="status-detail" class="status-detail">Reading only caption tracks the page exposes to your browser.</p>
      </section>
      <section id="track-panel" class="track-panel" hidden>
        <label for="track-select">Caption track</label>
        <select id="track-select"></select>
        <dl class="track-facts">
          <div><dt>Language</dt><dd id="language">—</dd></div>
          <div><dt>Source</dt><dd id="origin">—</dd></div>
          <div><dt>Stream</dt><dd id="live-status">—</dd></div>
        </dl>
      </section>
      <section id="preview" class="preview" hidden aria-label="Current caption">
        <p class="eyebrow">Now saying</p>
        <p id="caption-text" class="caption-text quiet">Waiting for the next caption…</p>
      </section>
      <div class="actions">
        <button id="open-reader" class="button button--primary" type="button" disabled>Open large-text reader</button>
      </div>
      <p class="privacy-note">Nothing is uploaded, saved, or downloaded.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
